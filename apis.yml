apis:
- name: Yeeps Storefront MCP
  description: Live Shopify-hosted storefront MCP endpoint for the Yeeps store,
    exposing catalog search, cart management, product details, and shop policy/FAQ
    tools over JSON-RPC (streamable HTTP). Probed live 2026-07-21 with tools/list
    returning 5 tools. A parallel UCP MCP endpoint (/api/ucp/mcp) requires a UCP
    agent profile. An equivalent endpoint runs on gogvr.com for Gods of Gravity.
  humanURL: https://yeeps.com
