aid: trass-games
name: Trass Games
description: Trass Games is an a16z-backed independent VR game studio best known for
  Yeeps - Hide and Seek, a free-to-play social hide-and-seek and building game on Meta
  Quest, and Gods of Gravity, an arcade space RTS. The studio ships a Yeeps companion
  app for iOS and Android, sells plush, maker-kit, and apparel merchandise through
  Shopify storefronts at yeeps.com and godsofgravityvr.com, and runs a community
  licensing program for creators. Trass Games publishes no first-party developer API,
  but its storefronts expose agent-ready commerce surfaces including llms.txt,
  agents.md, a Universal Commerce Protocol (UCP) merchant profile, and a live
  storefront MCP endpoint.
